[package]
name = "wadtools"
version = "0.5.7"
edition = "2021"

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
eyre = "0.6.12"
toml = "0.8.19"
fancy-regex = "0.16.2"
league-toolkit = { version = "0.2.17", features = ["serde"] }
color-eyre = "0.6"
tracing = "0.1.41"
parking_lot = "0.12.3"
walkdir = "2.4.0"
itertools = "0.12.0"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0"
tracing-subscriber = { version = "0.3.2", features = ["local-time"] }
colored = "2"
csv = "1.3.1"
time = "0.3.37"
tracing-indicatif = "0.3.13"
indicatif = "0.18"
directories-next = "2.0"
dirs-next = "2.0"
camino = "1.1"
convert_case = "0.9.0"
rayon = "1.10"
dashmap = "6"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
# `download-hashes` streams release assets through our own progress-bar `Fetch`
# (mimir's bundled `UreqFetch` buffers the whole body, so it can't drive a bar).
ureq = "2.12"

# TODO: switch to crates.io (ltk_mimir_cache = "0.1", ltk_hashdb = "0.1") once published.
# The `ureq` feature exposes mimir's `HttpFetchError` (reused by our fetcher).
ltk_mimir_cache = { git = "https://github.com/LeagueToolkit/mimir", rev = "c3282dfc0f7a03675bddda434b3202b05fe4a6a7", features = ["ureq"] }
ltk_hashdb = { git = "https://github.com/LeagueToolkit/mimir", rev = "c3282dfc0f7a03675bddda434b3202b05fe4a6a7" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
